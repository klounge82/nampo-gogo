name: Build Staging Field APK

on:
  push:
    branches:
      - 'staging/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Staging APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms and Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Staging Android Keystore
        working-directory: 04_Source_Code/frontend/android
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/upload-keystore.jks \
            -storepass nampogogostaging2026 \
            -alias nampogogostaging \
            -keypass nampogogostaging2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NampoGoGo Staging, OU=Field Test, O=NampoGoGo, L=Busan, C=KR"
          cp app/upload-keystore.jks upload-keystore.jks
          cat <<EOF > key.properties
          MAPS_API_KEY=AIzaSyCmSL87cU8vAyD-hUpgw_Tz0a8mRQzKmao
          storePassword=nampogogostaging2026
          keyPassword=nampogogostaging2026
          keyAlias=nampogogostaging
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        working-directory: 04_Source_Code/frontend
        run: flutter pub get

      - name: Build Staging APK
        working-directory: 04_Source_Code/frontend
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://backend-staging-f18f.up.railway.app 2>&1 | tee /tmp/flutter_build.log || {
              echo "=== FLUTTER BUILD ERROR SNIPPET ==="
              tail -n 100 /tmp/flutter_build.log > /tmp/error_summary.txt
              cat /tmp/error_summary.txt
              exit 1
            }

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nampo-gogo-staging-c420ddd
          path: 04_Source_Code/frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Error Summary Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-summary
          path: /tmp/error_summary.txt
          retention-days: 3

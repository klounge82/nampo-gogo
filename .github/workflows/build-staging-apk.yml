name: Build Staging Field APK

on:
  push:
    branches:
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Staging APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms and Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Configure Google Services
        working-directory: 04_Source_Code/frontend/android/app
        run: |
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "802989300624",
              "project_id": "nampo-gogo-prod",
              "storage_bucket": "nampo-gogo-prod.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:802989300624:android:466bf72465ed7605b3f115",
                  "android_client_info": {
                    "package_name": "com.nampogogo.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBoW7vZbRQh6BzVw5nWb5Su-NOxDlDuBAw"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Configure Staging Android Keystore
        working-directory: 04_Source_Code/frontend/android
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/upload-keystore.jks \
            -storetype PKCS12 \
            -storepass nampogogostaging2026 \
            -alias nampogogostaging \
            -keypass nampogogostaging2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NampoGoGo Staging, OU=Field Test, O=NampoGoGo, L=Busan, C=KR" \
            -noprompt
          cp app/upload-keystore.jks upload-keystore.jks
          cat <<EOF > key.properties
          MAPS_API_KEY=AIzaSyCmSL87cU8vAyD-hUpgw_Tz0a8mRQzKmao
          storePassword=nampogogostaging2026
          keyPassword=nampogogostaging2026
          keyAlias=nampogogostaging
          storeFile=upload-keystore.jks
          EOF
          keytool -list -v -keystore app/upload-keystore.jks -storepass nampogogostaging2026

      - name: Install dependencies
        working-directory: 04_Source_Code/frontend
        run: flutter pub get

      - name: Build Staging APK
        working-directory: 04_Source_Code/frontend
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://backend-staging-f18f.up.railway.app

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nampo-gogo-staging-c420ddd
          path: 04_Source_Code/frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
